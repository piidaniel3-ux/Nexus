<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Formations</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=DM+Mono:wght@300;400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css">
<script src="https://www.paypal.com/sdk/js?client-id=VOTRE_PAYPAL_CLIENT_ID&currency=EUR"></script>
</head>
<body>
<div id="cursor"></div><div id="cursor-ring"></div>
<nav id="navbar">
  <a href="/" class="nav-logo">NEX<span>US</span></a>
  <ul class="nav-links"><li><a href="/formations.html" class="active">Formations</a></li><li><a href="/#apropos">À propos</a></li><li><a href="/#contact">Contact</a></li></ul>
  <div class="nav-auth" id="navAuth"><a href="/login.html" class="btn-nav-login">Connexion</a><a href="/login.html?mode=register" class="btn-nav">Commencer →</a></div>
</nav>
<div class="page-header">
  <div style="font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:20px;">— Catalogue complet</div>
  <h1>Nos <em>formations</em><br>premium</h1>
</div>
<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-cat="Tout">Tout (9)</button>
  <button class="filter-btn" data-cat="Marketing Digital">Marketing Digital</button>
  <button class="filter-btn" data-cat="E-commerce">E-commerce</button>
  <button class="filter-btn" data-cat="Trading">Trading</button>
  <button class="filter-btn" data-cat="OFM IA">OFM IA</button>
</div>
<div class="formations-grid" id="formationsGrid">
  <div style="text-align:center;padding:80px;color:var(--muted);grid-column:1/-1;">Chargement...</div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
    <div id="paypalBtn"></div>
    <div id="paypalMsg" style="display:none;margin-top:16px;font-size:12px;text-align:center;"></div>
  </div>
</div>
<footer>
  <div class="footer-copy">© 2025 NEXUS Formations</div>
  <div class="footer-links"><a href="/">Accueil</a><a href="/login.html">Connexion</a><a href="/#contact">Contact</a></div>
</footer>
<script src="/js/global.js"></script>
<script>
let allFormations=[],userFormations=[],currentFormation=null,paypalRendered=false;

async function loadFormations(){
  try{
    const token=getToken();
    const [fRes,uData]=await Promise.all([
      fetch('/api/formations').then(r=>r.json()),
      token?fetch('/api/auth/me',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()).catch(()=>null):null
    ]);
    allFormations=fRes;
    if(uData&&uData.formations)userFormations=uData.formations;
    const urlCat=new URLSearchParams(location.search).get('cat');
    if(urlCat){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===urlCat));renderFormations(urlCat);}
    else renderFormations('Tout');
    if(new URLSearchParams(location.search).get('cancelled')==='true'){alert('Paiement annulé.');history.replaceState({},'','/formations.html');}
  }catch(e){document.getElementById('formationsGrid').innerHTML='<div style="color:var(--muted);text-align:center;grid-column:1/-1;padding:60px">Erreur de chargement.</div>';}
}

function renderFormations(cat){
  const list=cat==='Tout'?allFormations:allFormations.filter(f=>f.categorie===cat);
  document.getElementById('formationsGrid').innerHTML=list.map(f=>{
    const owned=userFormations.includes(f.id);
    return `<div class="f-card">
      <div class="f-badge">${f.badge}</div>
      <div class="f-icon">${f.image}</div>
      <div class="f-cat">${f.categorie}</div>
      <div class="f-titre">${f.titre}</div>
      <p class="f-desc">${f.description}</p>
      <div class="f-gratuit">🎁 ${f.modules_gratuits} module${f.modules_gratuits>1?'s':''} gratuit${f.modules_gratuits>1?'s':''}</div>
      <div class="f-meta"><span class="f-modules">${f.nb_modules} modules</span><span class="f-prix">${f.prix}€</span></div>
      ${owned?`<button class="f-btn owned" onclick="location.href='/dashboard'">✓ Déjà acquise</button>`:`<button class="f-btn" onclick="openModal('${f.id}')">Acheter cette formation</button>`}
    </div>`;
  }).join('');
}

document.getElementById('filterBar').addEventListener('click',e=>{
  const btn=e.target.closest('.filter-btn');if(!btn)return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');renderFormations(btn.dataset.cat);
});

function openModal(id){
  if(!getToken()){if(confirm('Vous devez être connecté pour acheter. Se connecter ?'))window.location.href='/login.html?mode=register';return;}
  currentFormation=allFormations.find(f=>f.id===id);if(!currentFormation)return;
  document.getElementById('modalContent').innerHTML=`
    <div style="font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;">${currentFormation.categorie}</div>
    <div class="modal-title">${currentFormation.titre}</div>
    <div class="modal-price">${currentFormation.prix}€</div>
    <p class="modal-desc">${currentFormation.description}<br><br>
      <strong style="color:var(--white)">${currentFormation.nb_modules} modules inclus</strong> — Accès à vie — Paiement sécurisé PayPal
    </p>`;
  document.getElementById('paypalBtn').innerHTML='';
  document.getElementById('paypalMsg').style.display='none';
  paypalRendered=false;
  document.getElementById('modalOverlay').classList.add('open');
  if(window.paypal)renderPayPal();
}

function renderPayPal(){
  if(paypalRendered)return;paypalRendered=true;
  paypal.Buttons({
    createOrder:async()=>{
      const res=await fetch('/api/payment/create-order',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({formation_id:currentFormation.id})});
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||'Erreur PayPal');
      return data.order_id;
    },
    onApprove:async(data)=>{
      const res=await fetch('/api/payment/capture-order',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({order_id:data.orderID,formation_id:currentFormation.id})});
      const result=await res.json();
      const msg=document.getElementById('paypalMsg');
      if(result.success){
        msg.style.color='var(--gold)';msg.textContent='✓ Paiement confirmé ! Redirection...';msg.style.display='block';
        userFormations.push(currentFormation.id);
        setTimeout(()=>{closeModal();window.location.href='/dashboard';},2000);
      }else{msg.style.color='#ff7070';msg.textContent=result.error||'Erreur lors de la validation';msg.style.display='block';}
    },
    onError:()=>{const msg=document.getElementById('paypalMsg');msg.style.color='#ff7070';msg.textContent='Erreur PayPal. Veuillez réessayer.';msg.style.display='block';}
  }).render('#paypalBtn');
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('open');paypalRendered=false;}
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
loadFormations();
</script>
</body>
</html>
